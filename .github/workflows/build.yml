name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build app shell (Java -> classes.dex)
        run: |
          ANDROID_JAR=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p shellbuild/classes app/src/main/assets/shell
          javac --release 8 -cp "$ANDROID_JAR" -d shellbuild/classes $(find shell/src -name '*.java')
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 24 --output app/src/main/assets/shell $(find shellbuild/classes -name '*.class')
          ls -l app/src/main/assets/shell

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK as pre-release "nightly"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RustPad-debug.apk
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly RustPad-debug.apk --prerelease \
            --title "RustPad nightly" --notes "Debug build from ${GITHUB_SHA::7}"
