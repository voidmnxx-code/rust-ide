name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Load fixed signing key (secret RUSTPAD_KEYSTORE_B64)
        env:
          KS_B64: ${{ secrets.RUSTPAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rustpad.jks"
            echo "RUSTPAD_KS_FILE=$RUNNER_TEMP/rustpad.jks" >> "$GITHUB_ENV"
            echo "Using fixed signing key"
          else
            echo "::warning::Secret RUSTPAD_KEYSTORE_B64 missing - using random debug key (updates will fail)"
          fi

      - name: Build app shell (Java -> classes.dex)
        run: |
          ANDROID_JAR=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p shellbuild/classes app/src/main/assets/shell
          javac --release 8 -cp "$ANDROID_JAR" -d shellbuild/classes $(find shell/src -name '*.java')
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 24 --output app/src/main/assets/shell $(find shellbuild/classes -name '*.class')
          ls -l app/src/main/assets/shell

      - name: Fetch tree-sitter sources
        run: tools/fetch_treesitter.sh

      - name: Build debug APK
        run: |
          NDK=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          CMAKE=$(ls "$ANDROID_HOME/cmake" | sort -V | tail -1)
          echo "NDK=$NDK CMAKE=$CMAKE"
          gradle :app:assembleDebug --no-daemon --stacktrace -PndkVersion="$NDK" -PcmakeVersion="$CMAKE"

      - name: Publish APK as pre-release "nightly"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RustPad-debug.apk
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly RustPad-debug.apk --prerelease \
            --title "RustPad nightly" --notes "Debug build from ${GITHUB_SHA::7}"
