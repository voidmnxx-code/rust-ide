name: Inspect Termux packages
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List rust-related packages and rust .deb contents
        run: |
          python3 - <<'PY'
          import sys, subprocess, os, tempfile
          sys.path.insert(0, "tools/bootstrap")
          import build_bootstrap as bb
          base = "https://packages.termux.dev/apt/termux-main"
          pkgs, _ = bb.parse_index(bb.load_index(base))
          names = sorted(n for n in pkgs if any(k in n for k in ("rust", "clippy", "lldb", "taplo", "wasm", "cargo", "mdbook")))
          print("PACKAGES:", names)
          for n in ("rust", "rust-analyzer"):
              f = pkgs.get(n)
              if not f: print(n, "missing"); continue
              print(n, f.get("Version"), f.get("Installed-Size"), "deps:", f.get("Depends"))
              p = os.path.join(tempfile.mkdtemp(), "x.deb")
              open(p, "wb").write(bb.fetch(base + "/" + f["Filename"]))
              sh = lambda c: subprocess.run(c, shell=True, capture_output=True, text=True).stdout
              data = sh("ar t %s | grep data" % p).strip()
              dec = "-J" if data.endswith("xz") else ("-z" if data.endswith("gz") else "--zstd")
              lst = sh("ar p %s %s | tar -t %s" % (p, data, dec))
              print("BIN:", [l for l in lst.split("\n") if "/bin/" in l and not l.endswith("/")][:40])
              print("RUSTLIB:", sh("ar p %s %s | tar -t %s | grep -o 'rustlib/[^/]*/' | sort | uniq -c" % (p, data, dec)))
              print("DOCS/SRC:", [l for l in lst.split("\n") if l.count("/") <= 8 and ("share/doc" in l or "lib/rustlib/src" in l)][:6])
          PY
