# Rustlings exercises for RustPad. Exercises, hints and solutions: Rustlings (MIT), https://github.com/rust-lang/rustlings
[package]
name = "rustlings_exercises"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
unstable_features = "forbid"
dead_code = "allow"

