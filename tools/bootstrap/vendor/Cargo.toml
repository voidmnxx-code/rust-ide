# قائمة المكتبات التي تُحمَّل مسبقاً للعمل بلا اتصال (cargo vendor).
# الأسماء المستعارة (rand8 ...) تجلب إصدارين رئيسيين للمكتبات التي تغيّر إصدارها الرئيسي حديثاً.
[package]
name = "rustpad-vendor"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
toml9 = { package = "toml", version = "0.9" }
anyhow = "1"
thiserror = "2"
thiserror1 = { package = "thiserror", version = "1" }
rand = "0.9"
rand8 = { package = "rand", version = "0.8" }
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
itertools = "0.14"
once_cell = "1"
lazy_static = "1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
rayon = "1"
parking_lot = "0.12"
crossbeam = "0.8"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
walkdir = "2"
csv = "1"
smallvec = "1"
memchr = "2"
num-traits = "0.2"
ahash = "0.8"
dashmap = "6"
async-trait = "0.1"
flate2 = "1"
# أندرويد
jni = "0.21"
android_logger = "0.15"
ndk-context = "0.1"
